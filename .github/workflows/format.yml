name: C# formatting

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.201'
      - name: Check C# whitespace without game dependencies
        run: dotnet format whitespace ./src --folder --verify-no-changes
